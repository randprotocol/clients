# The wallet against a real node: the wallet's real transport, reply validators and flows (the wasm
# core and engine under Node, real `fetch`) against a real `rand-node` from the fullnode v0.8.0
# release (chain 21 onward: constraint set 9, which this wallet's core proves for), on a Test-profile chain the test cuts itself. See scripts/e2e-node.sh for what it covers
# and web/wallet/test/node.e2e.test.mjs for the cases.
#
# The node binaries are the release's, not built here: that is what makes this a check of the
# wallet against the node that is deployed, and it keeps the job to the wasm core's build plus about
# a minute of tests with `rand-prover`'s one real bundle proof on top (a few minutes on a shared
# runner). To test against another release set FULLNODE_TAG; nothing the suite asserts may depend on
# a node feature newer than v0.8.0.
#
# `fullnode-main` is the other half: the same suites against `rand-node`/`rand-prover` BUILT from
# fullnode main (or `fullnode_ref` by hand), every night and on demand, so a change on the node that
# breaks this wallet turns this repository red within a day even when no fullnode pull request ran
# fullnode's own `clients` job (fullnode .github/workflows/clients.yml, which runs these suites on
# every fullnode pull request).
name: node-integration

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 19:00 UTC daily: an hour after fullnode's nightly.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      fullnode_ref:
        description: "randprotocol/fullnode ref for the fullnode-main job (default: main)"
        required: false

permissions:
  contents: read

concurrency:
  group: node-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1
  FULLNODE_TAG: v0.8.0

jobs:
  real-node:
    name: real-node
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Cache cargo registry and wasm-bindgen
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/wasm-bindgen*
          key: cargo-wasm-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('core/Cargo.lock') }}
      - name: Cache the wasm core's build
        uses: actions/cache@v4
        with:
          path: core/target
          key: core-target-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: core-target-${{ env.RUST_TOOLCHAIN }}-
      - name: The wasm core
        run: core/scripts/build-wasm.sh
      - name: Download the fullnode ${{ env.FULLNODE_TAG }} release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/fullnode"
          gh release download "$FULLNODE_TAG" --repo randprotocol/fullnode \
            --pattern rand-node --pattern rand-prover --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/fullnode"
          (cd "$RUNNER_TEMP/fullnode" && sha256sum -c --ignore-missing SHA256SUMS)
          chmod +x "$RUNNER_TEMP/fullnode/rand-node" "$RUNNER_TEMP/fullnode/rand-prover"
          "$RUNNER_TEMP/fullnode/rand-node" --version
          {
            echo "RAND_NODE_BIN=$RUNNER_TEMP/fullnode/rand-node"
            echo "RAND_PROVER_BIN=$RUNNER_TEMP/fullnode/rand-prover"
          } >> "$GITHUB_ENV"
      - name: The wallet against the real node
        run: scripts/e2e-node.sh

  fullnode-main:
    name: fullnode-main
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: randprotocol/fullnode
          ref: ${{ inputs.fullnode_ref || 'main' }}
          path: .fullnode
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Cache cargo registry and wasm-bindgen
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/wasm-bindgen*
          key: cargo-wasm-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('core/Cargo.lock') }}
      - name: Cache the wasm core's build
        uses: actions/cache@v4
        with:
          path: core/target
          key: core-target-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: core-target-${{ env.RUST_TOOLCHAIN }}-
      - name: Cache the fullnode build
        uses: actions/cache@v4
        with:
          path: .fullnode/target
          key: fullnode-target-${{ hashFiles('.fullnode/Cargo.lock') }}
          restore-keys: fullnode-target-
      - name: The wasm core
        run: core/scripts/build-wasm.sh
      - name: rand-node and rand-prover from fullnode ${{ inputs.fullnode_ref || 'main' }}
        working-directory: .fullnode
        run: |
          cargo build --release --locked -p randprotocol-node -p randprotocol-prover
          target/release/rand-node --version
          {
            echo "RAND_NODE_BIN=$PWD/target/release/rand-node"
            echo "RAND_PROVER_BIN=$PWD/target/release/rand-prover"
          } >> "$GITHUB_ENV"
      - name: The wallet against fullnode ${{ inputs.fullnode_ref || 'main' }}
        run: scripts/e2e-node.sh
