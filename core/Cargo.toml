[workspace]
resolver = "2"
members = ["crates/wallet-core", "crates/wallet-ffi", "crates/wallet-wasm"]
# The vendored fullnode crates inherit from their own workspace root, not this one.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["RandProtocol Contributors"]

[workspace.dependencies]
# The chain's own crates, pinned by the submodule at core/vendor/fullnode (commit 9c142c1, v0.5.1,
# the build chain 14 runs). Bump the submodule to move the wallet to a new chain build.
randprotocol-core = { path = "vendor/fullnode/crates/randprotocol-core" }
randprotocol-zkvm = { path = "vendor/fullnode/crates/randprotocol-zkvm" }
wallet-core = { path = "crates/wallet-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

# The proof system is unusable in an unoptimised build; keep dependencies optimised in dev too.
[profile.dev.package."*"]
opt-level = 3

# The zkVM crate is one enormous generic module; LLVM's wasm backend takes tens of minutes on it
# as a single codegen unit (native takes under a minute). Splitting it costs little at fat LTO.
[profile.release.package.randprotocol-zkvm]
codegen-units = 16

# The browser build. LLVM's wasm backend does not finish randprotocol-zkvm at opt-level 3 (killed after
# 4 CPU-hours); lower optimisation for that crate is the difference between minutes and never.
[profile.wasm]
inherits = "release"
lto = "thin"
codegen-units = 16
opt-level = 2
[profile.wasm.package.randprotocol-zkvm]
opt-level = 1
