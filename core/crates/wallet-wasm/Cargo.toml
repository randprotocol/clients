[package]
name = "wallet-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "wasm-bindgen binding of wallet-core for the browser extensions"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wallet-core = { workspace = true }
wasm-bindgen = "0.2"
# A panic inside the prover otherwise surfaces as a bare `unreachable`; this prints the message.
console_error_panic_hook = "0.1"
