[package]
name = "wallet-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "C ABI (iOS) and JNI (Android) bindings of wallet-core"

[lib]
name = "shrugg_wallet"
# staticlib for the iOS XCFramework, cdylib for the Android .so.
crate-type = ["staticlib", "cdylib"]

[dependencies]
wallet-core = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
