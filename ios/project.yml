# xcodegen spec. `xcodegen generate` rewrites RandWallet.xcodeproj; the generated project is
# committed so a checkout builds without xcodegen.
name: RandWallet
options:
  bundleIdPrefix: org.randprotocol
  # English is the source language of Localizable.xcstrings / InfoPlist.xcstrings (ios/LOCALIZATION.md).
  developmentLanguage: en
  # knownRegions: English plus the nineteen languages translators fill in. xcodegen has no key for
  # it, so the list is written into the generated project after each `xcodegen generate`.
  postGenCommand: scripts/known-regions.sh en ru zh-Hans zh-Hant-HK ko id ms ja ar fa ur ps hi ta es pt-BR de fr it pl
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.2"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team id here (or pass DEVELOPMENT_TEAM=… to xcodebuild).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
    # String catalogs: the compiler records every String(localized:) / LocalizedStringKey literal so
    # `xcodebuild -exportLocalizations` and Xcode's catalog sync see them (ios/LOCALIZATION.md).
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZED_STRING_SWIFTUI_SUPPORT: "YES"
targets:
  RandWallet:
    type: application
    platform: iOS
    sources:
      - path: RandWallet
        excludes:
          - "**/.DS_Store"
    dependencies:
      - framework: Frameworks/RandWalletCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.randprotocol.wallet
        PRODUCT_NAME: RandWallet
        INFOPLIST_FILE: RandWallet/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        PRODUCT_MODULE_NAME: RandWallet
  RandWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RandWalletTests
      # durian-core's own AMM vectors: the very file ui/test/amm.test.mjs reads (AmmTests).
      - path: ../ui/test/fixtures/amm-vectors.json
        buildPhase: resources
    dependencies:
      - target: RandWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.randprotocol.wallet.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  RandWallet:
    build:
      targets:
        RandWallet: all
        RandWalletTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [RandWalletTests]
    archive:
      config: Release
