[package]
name = "rand-wallet-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["RandProtocol Contributors"]
description = "Rand Wallet for Windows, Linux and macOS: a native shielded RAND wallet on the shared Rust core"
default-run = "rand-wallet"

[[bin]]
name = "rand-wallet"
path = "src/main.rs"

# Standalone: not a member of core/'s workspace, so it has its own target/ and never queues
# behind the mobile and wasm builds for the cargo lock.
[workspace]

[dependencies]
wallet-core = { path = "../core/crates/wallet-core" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
ureq = { version = "2", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
dirs = "6"
qrcode = { version = "0.14", default-features = false }
open = "5"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3

[package.metadata.bundle]
name = "Rand Wallet"
identifier = "org.randprotocol.wallet.desktop"
icon = ["assets/icon-1024.png"]
category = "public.app-category.finance"
short_description = "A shielded wallet for RAND"
