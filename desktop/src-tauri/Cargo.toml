[package]
name = "rand-wallet-desktop"
version = "0.6.7"
edition = "2021"
license = "GPL-3.0-only"
authors = ["RandProtocol Contributors"]
description = "Rand Wallet for Windows, Linux and macOS: the shared wallet UI in a Tauri webview, with native proving on the shared Rust core"
default-run = "rand-wallet"

[[bin]]
name = "rand-wallet"
path = "src/main.rs"

# Standalone: not a member of core/'s workspace, so it has its own target/ and never queues behind
# the mobile and wasm builds for the cargo lock.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The chain crypto, linked directly as a Rust crate — `wallet-ffi`'s C ABI is for iOS and Android.
# This is the only dependency that is about the wallet rather than about being an app.
wallet-core = { path = "../../core/crates/wallet-core" }
tauri = { version = "2", features = [] }
# `platform.openExternal` — scoped to the explorer in capabilities/default.json.
tauri-plugin-opener = "2"
# `system_memory_gib`, which is all `send.canProve()` has to go on. Only the system half.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6"
tauri-plugin-deep-link = "2"
# One wallet process per user: on Windows/Linux the OS answers a second `randpay:` click by
# launching this binary again with the link as its argument, and two processes would write the
# same store file (vault included). With `deep-link`, the plugin hands the second launch's argv to
# the running instance's deep-link plugin, which emits the same `deep-link://new-url` the UI
# already listens on, and the second process exits.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# "Prove for my other devices" (delegated-proving spec 2026-09-28 §5): the fullnode's own prover
# service — key, pairings, queue and `prover_*` listener — run inside this process on 127.0.0.1.
# `service` is the half that is axum + tokio; `wallet-core` names the same crate codec-only and
# cargo unifies the features. Not a second implementation: this app only starts and stops it.
randprotocol-prover = { path = "../../core/vendor/fullnode/crates/randprotocol-prover", features = ["service"] }
# The listener is bound here, before the service starts, so a busy port is a sentence rather than
# an anyhow chain; and `ProverState`'s lock is held across that await. Already in the tree (Tauri).
tokio = { version = "1", features = ["net", "sync"] }

[dev-dependencies]
# The prover tests seal a real job (the chain's bundle guest id, the witness length): the same
# vendored crate wallet-core and randprotocol-prover already build, named directly for the tests.
randprotocol-zkvm = { path = "../../core/vendor/fullnode/crates/randprotocol-zkvm" }

# Gone with the egui app this replaces: `eframe`/`egui` (the screens are ui/ now), `keyring` (the
# spend key is in the shared password-derived vault, not the OS credential store — see
# storage.rs), `ureq` (JSON-RPC is the webview's own fetch, so no node reply passes through Rust),
# `qrcode` (ui/lib/qr.js draws it), `open` (tauri-plugin-opener), `hex` (nothing here parses hex).

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"

# The proof system is unusable in an unoptimised build; keep dependencies optimised in dev too, so
# `cargo tauri dev` can actually prove a transfer rather than appearing to hang.
[profile.dev.package."*"]
opt-level = 3

# The fullnode's own Plonky3 fix (vendored at core/vendor/fullnode/vendor/p3-fri, fullnode 4d5b039):
# 0.7.0's HidingFriPcs held a spin lock across rayon work, and this app's prover host runs the
# prover service, whose `parallel` feature turns rayon on — so without it a proof here could spin
# for ever. A `[patch]` only applies in the workspace that declares it, so the fullnode's does not
# reach this build; it is repeated here.
[patch.crates-io]
p3-fri = { path = "../../core/vendor/fullnode/vendor/p3-fri" }
# The other half (fullnode 0e70ddc, Plonky3 PR #2368): MerkleTreeHidingMmcs::commit held the same
# spin lock across the parallel tree build.
p3-merkle-tree = { path = "../../core/vendor/fullnode/vendor/p3-merkle-tree" }
